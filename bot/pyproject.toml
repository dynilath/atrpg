[project]
name = "atrpg-bot"
version = "0.1.0"
description = "ATRPG QQ 群 AI 主持人验证程序"
# >=3.11：依赖内置 tomllib 读取 config.toml（3.11 起内置）
requires-python = ">=3.11"
dependencies = [
    "nonebot2[fastapi]>=2.5",
    "nonebot-adapter-qq>=1.7",
    "openai>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tomli-w>=1.0",
]

# NoneBot 插件声明（load_from_toml 只读这里，不读配置值）
# 新格式 dict：["@local"] 表示本地插件，值为插件名列表
[tool.nonebot]
plugin_dirs = []

[tool.nonebot.plugins]
"@local" = ["atrpg_gm"]
